name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Require an exact version tag
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME!=='v'+p.version) throw new Error('Tag must exactly match package.json version')"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source, tests, release configuration, and build
        run: npm run verify

  package:
    name: Sign and package (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-14
            command: npm run release:mac
            checksum-label: macos-arm64
          - name: Windows-x64
            os: windows-2022
            command: npm run release:win
            checksum-label: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CSC_LINK: ${{ matrix.name == 'macOS-arm64' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.name == 'macOS-arm64' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Materialize App Store Connect API key
        if: matrix.name == 'macOS-arm64'
        shell: bash
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and verify native package
        run: ${{ matrix.command }}
      - name: Write SHA-256 checksum manifest
        run: node scripts/release-checksums.mjs write ${{ matrix.checksum-label }}
      - name: Attest release provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/SHA256SUMS-*.txt
      - name: Upload verified release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.checksum-label }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ contains(github.ref_name, '-beta.') && 'beta-release' || 'stable-release' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      STABLE_ROLLBACK_EVIDENCE: ${{ secrets.STABLE_ROLLBACK_EVIDENCE }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download attested packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify all release checksums
        run: node scripts/release-checksums.mjs verify
      - name: Require exercised rollback evidence for stable
        if: ${{ !contains(github.ref_name, '-beta.') }}
        run: test -n "$STABLE_ROLLBACK_EVIDENCE"
      - name: Create release and upload installers, metadata, checksums, and notes
        shell: bash
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Grokky ${GITHUB_REF_NAME#v}" "${prerelease[@]}"
